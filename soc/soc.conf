# soc/soc.conf: what this SoC layer is: the facts of a Qualcomm SM6125 ("trinket"), whatever phone it is in.
# A phone with this SoC includes soc/configs/sm6125.config from its defconfig.

soc sm6125
	title       Qualcomm SM6125 "Snapdragon 665" (trinket, PM6125)
	title       also: SM6125-AD, QCM6125; devices ginkgo/willow/laurel_sprout
	vendor      Qualcomm
	cores       8, the biggest is core 7 (4x Cortex-A73 + 4x Cortex-A53)
	gpu         Adreno 610 (a6xx gen1), no node in mainline sm6125.dtsi yet
	pmic        PM6125 + PMI632 (charger/fuel gauge out-of-tree)
	maintainer  Joel (criollojoel10)
