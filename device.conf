# devices/laurel_sprout/device.conf: what this device repository is. tools/hakios-device.py reads it;
# docs/porting/repositories.md has every word, and the device's page (docs/devices/<name>.md) is made
# from it, so that the status is said in one place.
#
# Every row below is what has been SEEN on this phone. Nothing has been seen yet: the UEFI port exists
# upstream (Project Silicium, state "Inactive") but has not been revived here, so every part reads
# "not started". When a test passes, change its row in the same commit (phonewave's FEATURES.md rule).

device laurel_sprout
	title       Xiaomi Mi A3
	vendor      Xiaomi
	soc         sm6125
	defconfig   laurel_sprout_defconfig
	firmware    pull-firmware.sh
	maintainer  Joel (criollojoel10)
	status      boot        not started  needs the Silicium laurel_sprout platform revived (ClockDxe patch) and a boot image
	status      display     not started  panel samsung,s6e8fc0-m1906f9 over DSI0/MDSS; driver to write
	status      touch       not started  FocalTech FT3518 on i2c2 (ttlmm 87/88); CONFIG_HAKIOS_GOODIX is the template
	status      buttons     not started  volume-up on PM6125 GPIO 5; power key path unverified
	status      cpu         not started  8 cores (4xA73 + 4xA53); SM6125 uses RPM, not RPMh
	status      gpu         not started  Adreno 610; no gpu node in mainline sm6125.dtsi yet (gpucc-sm6125 exists)
	status      storage     not started  UFS 2.1; the loader reads it
	status      audio       not started  no mainline sound path; philipplinux/mia3-postmarketos has an out-of-tree DTBO
	status      wifi        not started  WCN3990 (ath10k_snoc); needs modem -> pd-mapper -> ath10k order (known from Kupfer)
	status      cellular    not started  SM6125 modem; soc_* values come from the phone's own device tree
	status      camera      not started  CAMSS on sm6125 is not enabled upstream
	status      haptics     ?           ERM motor, no driver looked at
	status      thermal     ?           pm6125_adc_tm channels exist in the board DT
